name: CI

# 触发：
#   - 任意分支推送 / PR：执行 run_all_tests.sh 做全套检查
#   - 推送带 `v*` 标签（如 v0.0.0-alpha.0）：在检查通过后，发布完整编译产物
#       · ide 插件的 .vsix
#       · Linux 版编译器独立压缩包（开箱即用）
#       · Windows 版编译器独立压缩包（开箱即用）
#
# 依赖说明：本仓库当前不使用任何 find_package 第三方依赖（无 abseil/re2/
# nlohmann-json/curl，测试也不使用 gtest），因此 CI 只需 LLVM + clang 即可构建。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

# 同一分支/标签的并发触发只保留最新一次：避免重复推送 tag 时多个 publish
# job 并发竞争创建 Release；正在运行的同组任务会被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 供 softprops/action-gh-release 创建 Release

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 普通推送 / PR：运行完整测试套件
  #   （宿主单元测试 + .suki 正例运行 + 负例诊断 + 待实现用例 + 解析健全性）
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test (run_all_tests.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (LLVM 18 + clang 18 + cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang libclang-18-dev cmake ninja-build

      - name: Run test suite
        # `bash <file>` 而非 ./<file>：不依赖脚本在 git 中的可执行位
        # （该位很容易在归档/导出时丢失，且在某些开发环境下检查不出来），
        # 脚本本身的 mode 仍已按 100755 记录，供本地 `./run_all_tests.sh` 使用。
        run: bash ./run_all_tests.sh

  # ───────────────────────────────────────────────────────────────────────────
  # 仅标签推送：构建并打包 Linux / Windows 编译器独立压缩包
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Package standalone toolchain (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sukicode-linux-x86_64
          - os: windows-latest
            artifact: sukicode-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: (Windows) Cache LLVM 18.1.8 build
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: D:\llvm-dev
          key: llvm-18.1.8-msvc-x86

      - name: (Linux) Install dependencies (LLVM 18 + clang 18)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang libclang-18-dev cmake ninja-build

      - name: (Windows) Build LLVM 18.1.8 from source (cached)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 官方 Windows 二进制包只含 clang 工具与 C ABI 库（LLVM-C 等），不含
          # C++ API 开发库（无 llvm/*.h 头文件、无 LLVMConfig.cmake、无 llvm-config.exe）。
          # 因此 MSVC 链接 LLVM C++ API 必须从源码构建 LLVM，并用 actions/cache 复用结果。
          $llvmRoot = "D:\llvm-dev"
          $cmakeDir = "$llvmRoot\lib\cmake\llvm"
          if (-not (Test-Path "$cmakeDir\LLVMConfig.cmake")) {
            Write-Host "Cache miss — 从源码构建 LLVM 18.1.8 ..."
            # 用 llvm-project 完整源码包：顶层为 llvm-project-18.1.8.src/{llvm,cmake,third-party,...}，
            # llvm/ 与其兄弟 cmake/、third-party/ 齐全，可正常 cmake 配置（单独的 llvm.src 包缺 third-party）。
            $srcUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/llvm-project-18.1.8.src.tar.xz"
            $tar = Join-Path $env:TEMP "llvm-project-18.1.8.src.tar.xz"
            curl.exe -L --retry 5 --retry-delay 5 -o $tar $srcUrl
            $srcRoot = "D:\llvm-src"
            New-Item -ItemType Directory -Force -Path $srcRoot | Out-Null
            tar -xf $tar -C $srcRoot
            $top = Get-ChildItem $srcRoot -Directory | Select-Object -First 1
            $llvmSrc = Join-Path $top.FullName "llvm"
            if (-not (Test-Path "$llvmSrc\CMakeLists.txt")) {
              Write-Host "srcRoot dirs:"; Get-ChildItem $srcRoot -Directory | ForEach-Object { $_.FullName }
              throw "LLVM 源码目录未找到：$llvmSrc"
            }
            cmake -S $llvmSrc -B "$srcRoot\build" -G "Visual Studio 18 2026" -A x64 `
              -DCMAKE_CONFIGURATION_TYPES=Release `
              -DLLVM_TARGETS_TO_BUILD=X86 `
              -DCMAKE_INSTALL_PREFIX="D:/llvm-dev" `
              -DLLVM_ENABLE_PROJECTS="" -DLLVM_ENABLE_RUNTIMES="" `
              -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF `
              -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_BUILD_LLVM_DYLIB=OFF `
              -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_TERMINFO=OFF
            cmake --build "$srcRoot\build" --config Release --parallel
            cmake --install "$srcRoot\build" --config Release
          } else {
            Write-Host "Cache hit — 复用已构建的 LLVM 18.1.8"
          }
          if (-not (Test-Path "$cmakeDir\LLVMConfig.cmake")) {
            throw "LLVM 构建产物缺失：$cmakeDir\LLVMConfig.cmake"
          }
          echo "LLVM_DIR=$cmakeDir" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: (Linux) Configure & build
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSUKICODE_BUILD_TESTS=OFF -DSUKICODE_BUILD_TOOLS=OFF
          cmake --build build --parallel

      - name: (Windows) Configure & build
        if: matrix.os == 'windows-latest'
        run: |
          # windows-latest 已迁移到 Visual Studio 2026，生成器名相应为 "Visual Studio 18 2026"；
          # LLVM_DIR 指向源码构建安装的 LLVMConfig.cmake，供 find_package(LLVM CONFIG) 定位
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 `
                -DCMAKE_BUILD_TYPE=Release -DSUKICODE_BUILD_TESTS=OFF `
                -DLLVM_DIR="$env:LLVM_DIR"
          cmake --build build --config Release

      - name: (Linux) Package standalone zip
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/package_linux.sh "${{ matrix.artifact }}"

      - name: (Windows) Package standalone zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .github/scripts/package_windows.ps1 "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

  # ───────────────────────────────────────────────────────────────────────────
  # 仅标签推送：构建并打包 VS Code 扩展 (.vsix)
  # ───────────────────────────────────────────────────────────────────────────
  vscode:
    name: Build VS Code extension (.vsix)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, compile & package extension
        run: |
          cd idePlugins/vscode
          npm install
          # 用仓库已有脚本 npm run pack（= vsce package）：使用 package.json 锁定的
          # vsce ^2.15.0，而非 npx 拉取的最新版；vsce 打包时自动执行 vscode:prepublish(tsc)
          npm run pack

      - name: Rename vsix to tag version
        run: |
          cd idePlugins/vscode
          VER="${GITHUB_REF_NAME#v}"
          mv *.vsix "sukicode-vscode-${VER}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: sukicode-vscode
          path: idePlugins/vscode/*.vsix

  # ───────────────────────────────────────────────────────────────────────────
  # 仅标签推送：将三个产物合并为一个 GitHub Release
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
