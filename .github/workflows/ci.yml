name: CI

# 触发：
#   - 任意分支推送 / PR：执行 run_all_tests.sh 做全套检查
#   - 推送带 `v*` 标签（如 v0.0.0-alpha.0）：在检查通过后，发布完整编译产物
#       · ide 插件的 .vsix
#       · Linux 版编译器独立压缩包（开箱即用）
#       · Windows 版编译器独立压缩包（开箱即用）
#
# 依赖说明：本仓库当前不使用任何 find_package 第三方依赖（无 abseil/re2/
# nlohmann-json/curl，测试也不使用 gtest），因此 CI 只需 LLVM + clang 即可构建。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

# 同一分支/标签的并发触发只保留最新一次：避免重复推送 tag 时多个 publish
# job 并发竞争创建 Release；正在运行的同组任务会被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 供 softprops/action-gh-release 创建 Release

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 普通推送 / PR：运行完整测试套件
  #   （宿主单元测试 + .suki 正例运行 + 负例诊断 + 待实现用例 + 解析健全性）
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test (run_all_tests.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (LLVM 18 + clang 18 + cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang libclang-18-dev cmake ninja-build

      - name: Run test suite
        # `bash <file>` 而非 ./<file>：不依赖脚本在 git 中的可执行位
        # （该位很容易在归档/导出时丢失，且在某些开发环境下检查不出来），
        # 脚本本身的 mode 仍已按 100755 记录，供本地 `./run_all_tests.sh` 使用。
        run: bash ./run_all_tests.sh

  # ───────────────────────────────────────────────────────────────────────────
  # 仅标签推送：构建并打包 Linux / Windows 编译器独立压缩包
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Package standalone toolchain (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sukicode-linux-x86_64
          - os: windows-latest
            artifact: sukicode-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: (Linux) Install dependencies (LLVM 18 + clang 18)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang libclang-18-dev cmake ninja-build

      - name: (Windows) Install LLVM 18.1.8
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 用 chocolatey 锁定安装 LLVM 18.1.8（LLVM 官方推荐的 Windows 包管理，
          # 自动处理官方安装器静默开关，固定安装到 Program Files\LLVM）。
          # -f 强制：即使镜像已预装其它 LLVM 版本，也覆盖为 18.1.8。
          choco install llvm --version=18.1.8 -y -f --no-progress
          # 诊断：确认官方 Windows 包是否含 LLVM 开发文件（LLVMConfig.cmake / 头文件 / 静态库）
          Write-Host "LLVMConfig.cmake exists: $([IO.File]::Exists('C:\Program Files\LLVM\lib\cmake\llvm\LLVMConfig.cmake'))"
          Write-Host "DataLayout.h      exists: $([IO.File]::Exists('C:\Program Files\LLVM\include\llvm\IR\DataLayout.h'))"
          Write-Host "LLVMSupport.lib   exists: $([IO.File]::Exists('C:\Program Files\LLVM\lib\LLVMSupport.lib'))"
          $llvmBin = "$env:ProgramFiles\LLVM\bin"
          # Windows 官方包不含 llvm-config.exe，以 clang.exe 作为安装成功标志。
          if (-not (Test-Path "$llvmBin\clang.exe")) {
            throw "LLVM 18.1.8 未安装成功：$llvmBin 下未找到 clang.exe"
          }
          echo "$llvmBin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: (Linux) Configure & build
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSUKICODE_BUILD_TESTS=OFF -DSUKICODE_BUILD_TOOLS=OFF
          cmake --build build --parallel

      - name: (Windows) Configure & build
        if: matrix.os == 'windows-latest'
        run: |
          # windows-latest 已迁移到 Visual Studio 2026，生成器名相应为 "Visual Studio 18 2026"；
          # CMAKE_PREFIX_PATH 指向 LLVM 安装前缀，供顶层 CMakeLists 的 find_package(LLVM CONFIG) 定位
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 `
                -DCMAKE_BUILD_TYPE=Release -DSUKICODE_BUILD_TESTS=OFF `
                -DCMAKE_PREFIX_PATH="C:/Program Files/LLVM" `
                -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"
          cmake --build build --config Release

      - name: (Linux) Package standalone zip
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/package_linux.sh "${{ matrix.artifact }}"

      - name: (Windows) Package standalone zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .github/scripts/package_windows.ps1 "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

  # ───────────────────────────────────────────────────────────────────────────
  # 仅标签推送：构建并打包 VS Code 扩展 (.vsix)
  # ───────────────────────────────────────────────────────────────────────────
  vscode:
    name: Build VS Code extension (.vsix)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, compile & package extension
        run: |
          cd idePlugins/vscode
          npm install
          # 用仓库已有脚本 npm run pack（= vsce package）：使用 package.json 锁定的
          # vsce ^2.15.0，而非 npx 拉取的最新版；vsce 打包时自动执行 vscode:prepublish(tsc)
          npm run pack

      - name: Rename vsix to tag version
        run: |
          cd idePlugins/vscode
          VER="${GITHUB_REF_NAME#v}"
          mv *.vsix "sukicode-vscode-${VER}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: sukicode-vscode
          path: idePlugins/vscode/*.vsix

  # ───────────────────────────────────────────────────────────────────────────
  # 仅标签推送：将三个产物合并为一个 GitHub Release
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
